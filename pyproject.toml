[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-platform"
version = "0.1.0"
description = "Live trading system with QuantConnect Lean integration"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Trading Platform Team", email = "team@trading-platform.com"},
]
keywords = ["trading", "quantconnect", "lean", "interactive-brokers", "algorithmic-trading"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.11.9",
    "pydantic-settings>=2.1.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "redis>=5.0.1",
    "sqlalchemy>=2.0.23",
    "alembic>=1.13.1",
    "ib-insync>=0.9.86",
    "pandas>=2.3.3",
    "numpy>=1.26.4",
    "torch>=2.2.2",
    "ta-lib>=0.6.4",
    "click>=8.3.0",
    "rich>=14.1.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    "requests>=2.32.5",
    "websockets>=14.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",
    "black>=23.11.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
    "mypy>=1.7.1",
    "pre-commit>=3.6.0",
]
ml = [
    "scikit-learn>=1.3.2",
    "transformers>=4.36.2",
    "langchain>=0.1.0",
    "openai>=1.6.1",
]
data = [
    "yfinance>=0.2.28",
    "alpha-vantage>=2.3.1",
    "matplotlib>=3.10.6",
    "seaborn>=0.13.0",
    "plotly>=5.17.0",
]

[project.urls]
Homepage = "https://github.com/your-org/trading-platform"
Documentation = "https://github.com/your-org/trading-platform/docs"
Repository = "https://github.com/your-org/trading-platform.git"
Issues = "https://github.com/your-org/trading-platform/issues"

[project.scripts]
trading-cli = "services.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["services*", "shared*", "strategies*"]

[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["services", "shared", "strategies"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--cov=services",
    "--cov=shared",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow running tests",
]
