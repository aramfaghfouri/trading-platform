version: '3.8'

services:
  # PostgreSQL for metadata
  postgres:
    image: postgres:15-alpine
    container_name: trading-postgres
    environment:
      POSTGRES_DB: trading_platform
      POSTGRES_USER: trading_user
      POSTGRES_PASSWORD: trading_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - trading-network

  # TimescaleDB for time-series data
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: trading-timescaledb
    environment:
      POSTGRES_DB: market_data
      POSTGRES_USER: timescale_user
      POSTGRES_PASSWORD: timescale_password
    ports:
      - "5433:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./scripts/init-timescaledb.sql:/docker-entrypoint-initdb.d/init-timescaledb.sql
    networks:
      - trading-network

  # Redis for caching and message queuing
  redis:
    image: redis:7-alpine
    container_name: trading-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - trading-network

  # Trading Platform Services
  strategy-manager:
    build:
      context: .
      dockerfile: docker/Dockerfile.services
    container_name: trading-strategy-manager
    environment:
      - ENVIRONMENT=production
      - POSTGRES_HOST=postgres
      - TIMESCALE_HOST=timescaledb
      - REDIS_HOST=redis
    depends_on:
      - postgres
      - timescaledb
      - redis
    volumes:
      - ./config:/app/config
      - ./strategies:/app/strategies
      - ./data:/app/data
    networks:
      - trading-network

  signal-processor:
    build:
      context: .
      dockerfile: docker/Dockerfile.services
    container_name: trading-signal-processor
    environment:
      - ENVIRONMENT=production
      - POSTGRES_HOST=postgres
      - TIMESCALE_HOST=timescaledb
      - REDIS_HOST=redis
    depends_on:
      - postgres
      - timescaledb
      - redis
    volumes:
      - ./config:/app/config
      - ./data:/app/data
    networks:
      - trading-network

  order-manager:
    build:
      context: .
      dockerfile: docker/Dockerfile.services
    container_name: trading-order-manager
    environment:
      - ENVIRONMENT=production
      - POSTGRES_HOST=postgres
      - TIMESCALE_HOST=timescaledb
      - REDIS_HOST=redis
      - IBKR_HOST=host.docker.internal
    depends_on:
      - postgres
      - timescaledb
      - redis
    volumes:
      - ./config:/app/config
      - ./data:/app/data
    networks:
      - trading-network

  risk-manager:
    build:
      context: .
      dockerfile: docker/Dockerfile.services
    container_name: trading-risk-manager
    environment:
      - ENVIRONMENT=production
      - POSTGRES_HOST=postgres
      - TIMESCALE_HOST=timescaledb
      - REDIS_HOST=redis
    depends_on:
      - postgres
      - timescaledb
      - redis
    volumes:
      - ./config:/app/config
      - ./data:/app/data
    networks:
      - trading-network

  portfolio-manager:
    build:
      context: .
      dockerfile: docker/Dockerfile.services
    container_name: trading-portfolio-manager
    environment:
      - ENVIRONMENT=production
      - POSTGRES_HOST=postgres
      - TIMESCALE_HOST=timescaledb
      - REDIS_HOST=redis
    depends_on:
      - postgres
      - timescaledb
      - redis
    volumes:
      - ./config:/app/config
      - ./data:/app/data
    networks:
      - trading-network

  data-manager:
    build:
      context: .
      dockerfile: docker/Dockerfile.services
    container_name: trading-data-manager
    environment:
      - ENVIRONMENT=production
      - POSTGRES_HOST=postgres
      - TIMESCALE_HOST=timescaledb
      - REDIS_HOST=redis
    depends_on:
      - postgres
      - timescaledb
      - redis
    volumes:
      - ./config:/app/config
      - ./data:/app/data
    networks:
      - trading-network

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: trading-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - strategy-manager
      - signal-processor
      - order-manager
      - risk-manager
      - portfolio-manager
      - data-manager
    networks:
      - trading-network

volumes:
  postgres_data:
  timescaledb_data:
  redis_data:

networks:
  trading-network:
    driver: bridge
