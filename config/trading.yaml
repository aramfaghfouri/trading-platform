# Trading Platform Configuration
trading:
  # General Settings
  general:
    platform_name: "VectorBT Trading Platform"
    version: "0.1.0"
    environment: "development"  # development, staging, production
    timezone: "America/New_York"
    
  # Trading Hours
  trading_hours:
    # Market Hours (EST/EDT)
    market_open: "09:30"
    market_close: "16:00"
    
    # Pre-market Hours
    premarket_open: "04:00"
    premarket_close: "09:30"
    
    # After-hours
    afterhours_open: "16:00"
    afterhours_close: "20:00"
    
    # Trading Days
    trading_days:
      - "monday"
      - "tuesday"
      - "wednesday"
      - "thursday"
      - "friday"
      
  # Risk Management
  risk_management:
    # Portfolio Risk
    portfolio:
      max_portfolio_risk: 0.20      # 20% maximum portfolio risk
      max_correlation: 0.70         # 70% maximum correlation between positions
      max_sector_exposure: 0.30     # 30% maximum sector exposure
      
    # Position Risk
    position:
      max_position_size: 0.10       # 10% maximum position size
      max_daily_trades: 50          # 50 maximum trades per day
      max_daily_loss: 0.05          # 5% maximum daily loss
      
    # Market Risk
    market:
      max_drawdown: 0.15            # 15% maximum drawdown
      volatility_threshold: 0.30    # 30% volatility threshold
      market_cap_minimum: 1000000000  # $1B minimum market cap
      
  # Order Management
  order_management:
    # Order Settings
    default_order_type: "MKT"
    default_time_in_force: "DAY"
    max_order_size: 10000
    min_order_size: 1
    
    # Order Validation
    validation:
      check_margin: true
      check_balance: true
      validate_symbol: true
      check_market_hours: true
      check_position_limits: true
      
    # Order Execution
    execution:
      max_retry_attempts: 3
      retry_delay: 1  # seconds
      execution_timeout: 30  # seconds
      
  # Data Management
  data_management:
    # Data Storage
    storage:
      enable_compression: true
      enable_retention: true
      retention_period: "1 year"
      backup_enabled: true
      backup_interval: "daily"
      
    # Data Quality
    quality:
      validate_data: true
      min_volume_threshold: 1000
      max_price_deviation: 0.1
      outlier_detection: true
      missing_data_handling: "interpolate"
      
  # Monitoring and Alerts
  monitoring:
    # System Monitoring
    system:
      monitor_cpu: true
      monitor_memory: true
      monitor_disk: true
      monitor_network: true
      alert_thresholds:
        cpu_usage: 80
        memory_usage: 80
        disk_usage: 90
        
    # Trading Monitoring
    trading:
      monitor_positions: true
      monitor_orders: true
      monitor_pnl: true
      monitor_risk: true
      alert_thresholds:
        daily_loss: 0.03    # 3% daily loss alert
        drawdown: 0.10      # 10% drawdown alert
        position_size: 0.08  # 8% position size alert
        
    # Data Monitoring
    data:
      monitor_data_quality: true
      monitor_data_latency: true
      monitor_api_limits: true
      alert_thresholds:
        data_latency: 5      # 5 seconds
        api_limit_usage: 80  # 80% of API limit
        
  # Logging
  logging:
    # Log Levels
    log_level: "INFO"
    log_file: "logs/trading_platform.log"
    log_rotation: "daily"
    log_retention: "30 days"
    
    # Log Categories
    categories:
      system: true
      trading: true
      data: true
      risk: true
      performance: true
      errors: true
      
  # Performance
  performance:
    # Optimization
    optimization:
      enable_caching: true
      cache_ttl: 300  # 5 minutes
      enable_parallel_processing: true
      max_workers: 4
      
    # Memory Management
    memory:
      max_memory_usage: 0.80  # 80% of available memory
      garbage_collection_interval: 3600  # 1 hour
      
  # Security
  security:
    # API Security
    api:
      enable_authentication: true
      enable_rate_limiting: true
      max_requests_per_minute: 100
      
    # Data Security
    data:
      encrypt_sensitive_data: true
      enable_audit_logging: true
      data_retention_policy: "1 year"
