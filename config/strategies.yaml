# Trading Strategies Configuration
strategies:
  # Strategy Registry
  registry:
    enabled_strategies:
      - "sma_crossover"
      - "rsi_mean_reversion"
      - "bollinger_bands"
      - "momentum"
      - "mean_reversion"
      
    # Strategy Settings
    settings:
      max_concurrent_strategies: 10
      strategy_timeout: 300  # seconds
      enable_parallel_execution: true
      
  # SMA Crossover Strategy
  sma_crossover:
    enabled: true
    parameters:
      short_window: 20
      long_window: 50
      signal_threshold: 0.02  # 2% threshold for signal generation
    risk_management:
      position_size: 0.1  # 10% of portfolio
      stop_loss: 0.05     # 5% stop loss
      take_profit: 0.15   # 15% take profit
    symbols:
      - "AAPL"
      - "MSFT"
      - "GOOGL"
      
  # RSI Mean Reversion Strategy
  rsi_mean_reversion:
    enabled: true
    parameters:
      rsi_period: 14
      oversold_threshold: 30
      overbought_threshold: 70
      lookback_period: 20
    risk_management:
      position_size: 0.08  # 8% of portfolio
      stop_loss: 0.03      # 3% stop loss
      take_profit: 0.08    # 8% take profit
    symbols:
      - "AAPL"
      - "MSFT"
      - "GOOGL"
      - "AMZN"
      
  # Bollinger Bands Strategy
  bollinger_bands:
    enabled: true
    parameters:
      period: 20
      std_dev: 2
      lookback_period: 50
    risk_management:
      position_size: 0.12  # 12% of portfolio
      stop_loss: 0.04      # 4% stop loss
      take_profit: 0.12    # 12% take profit
    symbols:
      - "AAPL"
      - "MSFT"
      - "GOOGL"
      - "AMZN"
      - "TSLA"
      
  # Momentum Strategy
  momentum:
    enabled: false  # Disabled by default
    parameters:
      lookback_period: 20
      momentum_threshold: 0.05  # 5% momentum threshold
      volume_threshold: 1.5     # 1.5x average volume
    risk_management:
      position_size: 0.15  # 15% of portfolio
      stop_loss: 0.06      # 6% stop loss
      take_profit: 0.20    # 20% take profit
    symbols:
      - "AAPL"
      - "MSFT"
      - "GOOGL"
      - "AMZN"
      - "TSLA"
      - "META"
      
  # Mean Reversion Strategy
  mean_reversion:
    enabled: false  # Disabled by default
    parameters:
      lookback_period: 20
      z_score_threshold: 2.0
      reversion_threshold: 0.02  # 2% reversion threshold
    risk_management:
      position_size: 0.10  # 10% of portfolio
      stop_loss: 0.04      # 4% stop loss
      take_profit: 0.10    # 10% take profit
    symbols:
      - "AAPL"
      - "MSFT"
      - "GOOGL"
      
  # Strategy Performance Settings
  performance:
    # Backtesting Settings
    backtesting:
      start_date: "2023-01-01"
      end_date: "2024-01-01"
      initial_capital: 100000
      commission: 0.001  # 0.1% commission
      slippage: 0.0005   # 0.05% slippage
      
    # Performance Metrics
    metrics:
      calculate_sharpe: true
      calculate_sortino: true
      calculate_max_drawdown: true
      calculate_win_rate: true
      calculate_profit_factor: true
      
    # Risk Metrics
    risk_metrics:
      calculate_var: true
      var_confidence: 0.95
      calculate_cvar: true
      calculate_volatility: true
      volatility_window: 252  # 1 year