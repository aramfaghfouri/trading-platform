[polygon]

[polygon.data_collection]
# Time configuration
time_interval = "minute"
start_date = "2024-10-05"
end_date = "2025-10-04"

# Tickers of interest
tickers = [
    "AAPL", "GOOGL", "MSFT", "TSLA", "AMZN",
    "NVDA", "META", "AMD", "XOM", "JPM",
    "JNJ", "V", "PG", "UNH", "HD", "MA",
    "DIS", "PYPL", "ADBE", "CRM", "NFLX",
    "INTC", "CSCO", "PFE", "ABT", "TMO",
    "ACN", "WMT", "KO", "PEP", "ABBV"
]

# Data collection settings
rate_limit_delay = 13  # seconds between requests
max_retries = 3
timeout = 30

[polygon.storage]
data_directory = "data_results"
logs_directory = "logs"
enable_compression = true
compression_format = "lz4"

[polygon.processing]
chunk_size = 50000
enable_parallel_processing = false
max_workers = 4
timezone = "America/New_York"

[polygon.api]
# Polygon.io API settings
base_url = "https://api.polygon.io"
rate_limit_per_minute = 5
max_requests_per_day = 1000

[polygon.output]
enable_csv_export = true
enable_json_export = true
enable_plotly_charts = true
enable_matplotlib_plots = true

[polygon.realtime]
enabled = false
symbols = []
snapshot_interval_sec = 1

[polygon.naming]
source_prefix = "polygon"
table_pattern = "{source}_ohlcv_{symbol}_{tf}"


[ibkr]

[ibkr.historical]
timeframe = "1m"          # one of: 1m, 5m, 1d
start_date = "2025-09-01"
end_date = "2025-09-30"
useRTH = true              # Regular Trading Hours only
what_to_show = "TRADES"   # TRADES, MIDPOINT, BID, ASK, etc.
symbols = [ "AAPL", "MSFT" ]

[ibkr.connection]
host = "127.0.0.1"        # can be overridden by env IBKR_HOST
port_paper = 7497          # env IBKR_PORT
port_live = 7496
client_id = 101

[ibkr.realtime]
symbols = [ "AAPL" ]
seconds = 60

[ibkr.trading]
allow_live = false         # must also set LIVE_TRADING_CONFIRM=true in env
max_order_qty = 1
default_tif = "DAY"

[ibkr.naming]
source_prefix = "ibkr"
table_pattern = "{source}_ohlcv_{symbol}_{tf}"


[etrade]

[etrade.historical]
timeframe = "1m"
start_date = "2025-09-01"
end_date = "2025-09-30"
symbols = []

[etrade.connection]
base_url = ""            # fill in when enabled

[etrade.realtime]
enabled = false
symbols = []

[etrade.trading]
allow_live = false

[etrade.naming]
source_prefix = "etrade"
table_pattern = "{source}_ohlcv_{symbol}_{tf}"


[binance]

[binance.historical]
timeframe = "1m"
start_date = "2025-09-01"
end_date = "2025-09-30"
symbols = []
market = "US"             # or "Futures", etc.

[binance.connection]
base_url = "https://api.binance.us"

[binance.realtime]
enabled = false
symbols = []

[binance.trading]
allow_live = false

[binance.naming]
source_prefix = "binance"
table_pattern = "{source}_ohlcv_{symbol}_{tf}"
[data_collection]
# Time configuration
