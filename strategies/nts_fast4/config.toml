# NTS FAST4 Strategy Runtime Configuration



# Strategy parameters
[parameters]
trail_type = "modified"  # or "unmodified"
atr_period = 185
atr_factor = 3.0
use_take_profit = true
tp_fib_level = "78.6"  # "61.8", "78.6", "88.6", "100.0"
quantity = 100
min_lookback = 200
mtf_resolution = "5m->15m"  # Chart TF -> Signal TF

# Backtest settings
[backtest]
start_date = "2025-09-01"
end_date = "2025-10-27"
initial_capital = 100000
commission_per_share = 0.005
symbols = ["AAPL"]

# Paper trading settings
[paper_trading]
enabled = true
initial_capital = 10000
commission_per_share = 0.005

# Live trading settings
[live_trading]
enabled = false
max_position_size = 1000
risk_per_trade = 0.02  # 2% risk per trade
